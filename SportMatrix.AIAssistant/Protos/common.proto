syntax = "proto3";

package sportmatrix;

message AthleteProfile {
  string name = 1;
  string fitness_level = 2;
  string primary_goal = 3;
}

message Workout {
  string date = 1;              // DateTime as string
  string activity_type = 2;     // "Running", "Cycling", etc.
  double distance = 3;          // Kilometers
  int32 duration = 4;           // Minutes
  int32 calories = 5;           // Calories burned
}
